name: kontur-dds
services:
  app:
    image: kontur-dds:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DDS_BIND_ADDRESS:-127.0.0.1}:${DDS_PORT:-8000}:8000"
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}"
      DATABASE_URL: sqlite:////app/backend/var/dds.db
      BACKUP_DIR: /app/backend/var/backups
      AI_MODE: rules
      AI_ENDPOINT: ""
      SPEECH_ENDPOINT: ""
      TTS_ENDPOINT: ""
    volumes:
      - dds-data:/app/backend/var
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  dds-data:
